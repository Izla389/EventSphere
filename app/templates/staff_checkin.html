
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Ticket Check-In | EventSphere</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between
                align-items-center mb-4">
        <h2>Staff Ticket Check-In</h2>

        <a href="/dashboard"
           class="btn btn-outline-secondary">
            Dashboard
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <p class="text-muted">
                Select the event and enter the QR ticket token
                to verify an attendee's ticket.
            </p>

            {% if message %}
            <div class="alert alert-success">
                {{ message }}
            </div>
            {% endif %}

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="/staff/checkin/">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >

                <div class="mb-3">
                    <label class="form-label">
                        Select Event
                    </label>

                    <select
                        name="event_id"
                        class="form-select"
                        required
                    >
                        <option value="">
                            Choose an event
                        </option>

                        {% for event in events %}
                        <option value="{{ event.id }}">
                            {{ event.title }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        QR Ticket Token
                    </label>

                    <input
                        type="text"
                        name="qr_token"
                        class="form-control"
                        placeholder="Paste QR token here"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Verify and Check In
                </button>

            </form>
        </div>
    </div>
</div>

</body>
</html>
